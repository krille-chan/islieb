name: islieb
description: Simple reader for isLieb comics
publish_to: "none"
version: 2.0.0+31

environment:
  sdk: ">=3.10.0 <4.0.0"
  flutter: 3.41.6

dependencies:
  cached_network_image: ^3.4.1
  dynamic_color: ^1.8.1
  firebase_core: ^4.6.0
  firebase_messaging: ^16.2.0
  flutter:
    sdk: flutter
  flutter_html: ^3.0.0
  hive_flutter: ^1.1.0
  http: ^1.6.0
  provider: ^6.1.5
  share_plus: ^12.0.1
  url_launcher: ^6.3.2
  webfeed: ^0.7.0

dev_dependencies:
  dart_code_linter: ^3.2.1
  flutter_launcher_icons: "^0.9.2"
  flutter_lints: ^6.0.0
  translations_cleaner: ^0.1.1

flutter_icons:
  android: true
  ios: true
  remove_alpha_ios: true
  adaptive_icon_background: "#ffffff"
  adaptive_icon_foreground: "assets/images/icon.png"
  image_path: "assets/images/icon.png"

flutter:
  uses-material-design: true
  assets:
    - "assets/images/"
